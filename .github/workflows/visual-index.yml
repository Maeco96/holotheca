name: Visual index

# Builds the visual index of the catalogue (one image per card, DINOv2 small vectors and
# difference hashes) and measures it on labelled phone photos (vectors only, no pixels).
# Card images are read from assets.tcgdex.net, which is only reachable from GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      sets:
        description: "Only sets whose id matches this regular expression (empty = all)"
        required: false
        default: ""
      official_budget:
        description: "Most requests to the official card sites in this run (1 per second)"
        required: false
        default: "0"
  schedule:
    - cron: "41 4 * * 2"  # weekly, Tuesday: new cards only (the previous index is reused)
  push:
    branches-ignore: [main]
    paths:
      - "etl/visual/**"
      - ".github/workflows/visual-index.yml"

permissions:
  contents: write

concurrency:
  group: visual-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet numpy==2.1.3 pillow==11.0.0 onnxruntime==1.20.1 onnx==1.17.0
      - name: Export the model (first run only)
        run: |
          if [ ! -f web/vendor/visual/dinov2s-int8.onnx ]; then
            pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet transformers==4.46.3
            python3 etl/visual/export_model.py --out web/vendor/visual/dinov2s-int8.onnx --fp32 "$RUNNER_TEMP/dinov2s.onnx"
            echo "MODEL_NEW=1" >> "$GITHUB_ENV"
          fi
          ls -la web/vendor/visual
      - name: Build the card index
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git "$RUNNER_TEMP/tcgdex"
          python3 etl/build_catalogue.py "$RUNNER_TEMP/tcgdex" --out "$RUNNER_TEMP/catalogue.sqlite"
          python3 etl/export_scan_index.py "$RUNNER_TEMP/catalogue.sqlite" --out "$RUNNER_TEMP/scan-index.json"
          python3 etl/sources/compare.py "$RUNNER_TEMP/catalogue.sqlite" etl/sources/data/*.json \
            --report "$RUNNER_TEMP/cmp.md" --images "$RUNNER_TEMP/official-images.json" > /dev/null
      - name: Restore the previous visual index
        uses: actions/cache/restore@v4
        with:
          path: previous-visual
          key: visual-index-${{ hashFiles('web/vendor/visual/dinov2s-int8.onnx', 'etl/visual/common.py') }}-${{ github.run_id }}
          restore-keys: visual-index-${{ hashFiles('web/vendor/visual/dinov2s-int8.onnx', 'etl/visual/common.py') }}-
      - name: Build the visual index
        run: |
          python3 etl/visual/build_index.py "$RUNNER_TEMP/scan-index.json" "$RUNNER_TEMP/official-images.json" \
            --model web/vendor/visual/dinov2s-int8.onnx --out visual --previous previous-visual \
            --sets "${{ github.event.inputs.sets }}" --official-budget "${{ github.event.inputs.official_budget || '0' }}"
          rm -rf previous-visual && cp -r visual previous-visual
      - name: Save the visual index
        uses: actions/cache/save@v4
        with:
          path: previous-visual
          key: visual-index-${{ hashFiles('web/vendor/visual/dinov2s-int8.onnx', 'etl/visual/common.py') }}-${{ github.run_id }}
      - name: Measure on labelled photos
        run: |
          mkdir -p docs/visual
          if [ -f etl/visual/probe/photos.json ]; then
            python3 etl/visual/evaluate.py visual etl/visual/probe/photos.json --out docs/visual/probe.md
          fi
      # The phone gets one packed file (phone_index.py) as the asset of the release
      # "visual-index"; pwa-pages.yml downloads it at deploy time.
      - name: Publish the phone index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 etl/visual/phone_index.py visual --method art --bits 1 --out "$RUNNER_TEMP/visual-index"
          gh release view visual-index > /dev/null 2>&1 || gh release create visual-index --title "Visual index" \
            --notes "Image vectors of the catalogue for the scanner's visual fallback. Built by .github/workflows/visual-index.yml; numbers only, no images." --latest=false
          gh release upload visual-index "$RUNNER_TEMP/visual-index.json" "$RUNNER_TEMP/visual-index.bin" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: visual-index
          path: visual/
          retention-days: 30
      - name: Commit the model and the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual web/vendor/visual 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Visual index: model and probe report from run ${{ github.run_number }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
