name: iOS build

# Builds an unsigned .ipa. It is signed on the phone by SideStore with a free Apple ID.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Holotheca.xcodeproj \
            -scheme Holotheca \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Holotheca.app Payload/
          zip -qry Holotheca.ipa Payload
          ls -lh Holotheca.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Holotheca-ipa
          path: ios/Holotheca.ipa
          if-no-files-found: error

  release:
    # Publishes the .ipa as a release asset so it can be downloaded straight from the phone.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Holotheca-ipa
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Holotheca.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Unsigned build from ${{ github.sha }}. Install with SideStore."
