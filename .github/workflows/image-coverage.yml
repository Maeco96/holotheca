name: Image coverage

# Measures how many cards and expansion logos have no picture on assets.tcgdex.net.
on:
  workflow_dispatch:
  push:
    paths:
      - "etl/sources/image_coverage.py"
      - ".github/workflows/image-coverage.yml"

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the card index
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git "$RUNNER_TEMP/tcgdex"
          python3 etl/build_catalogue.py "$RUNNER_TEMP/tcgdex" --out "$RUNNER_TEMP/catalogue.sqlite"
          python3 etl/export_scan_index.py "$RUNNER_TEMP/catalogue.sqlite" --out "$RUNNER_TEMP/scan-index.json"
          python3 etl/sources/compare.py "$RUNNER_TEMP/catalogue.sqlite" etl/sources/data/*.json \
            --report "$RUNNER_TEMP/cmp.md" --images "$RUNNER_TEMP/official-images.json"
      - name: Measure
        run: |
          mkdir -p out
          python3 etl/sources/image_coverage.py "$RUNNER_TEMP/scan-index.json" "$RUNNER_TEMP/official-images.json" \
            --out out/image-coverage.md --json out/image-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-coverage
          path: out/
      - name: Commit the report
        run: |
          mkdir -p docs/coverage
          cp out/image-coverage.md docs/coverage/image-coverage.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coverage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Image coverage report from run ${{ github.run_number }}"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
