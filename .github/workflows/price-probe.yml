name: Price probe

# Asks the price sources (Cardmarket files, TCGdex, TCGCSV) what they serve.
on:
  push:
    paths:
      - "etl/prices/probe.py"
      - "etl/prices/link_probe.py"
      - ".github/workflows/price-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 etl/prices/probe.py
      - run: python3 etl/prices/link_probe.py
