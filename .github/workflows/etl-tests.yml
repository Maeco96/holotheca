name: Tests

on:
  pull_request:
    paths:
      - "etl/**"
      - "db/**"
      - "tests/**"
      - "web/recognize.js"
      - ".github/workflows/etl-tests.yml"
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "db/**"
      - "tests/**"
      - "web/recognize.js"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ETL unit tests
        run: |
          pip install --quiet numpy==2.1.3 pillow==11.0.0
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scanner matching tests
        run: node --test tests/test_recognize.js
