name: PWA pages

# Publishes web/ with GitHub Pages. One-time setup in the repository:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "etl/**"
      - "db/**"
      - ".github/workflows/pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The card index is built from the open TCGdex data at deploy time, so it is never
      # committed and every deployment carries a fresh catalogue.
      - name: Build the card index
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git "$RUNNER_TEMP/tcgdex"
          python3 etl/build_catalogue.py "$RUNNER_TEMP/tcgdex" --out "$RUNNER_TEMP/catalogue.sqlite"
          python3 etl/export_scan_index.py "$RUNNER_TEMP/catalogue.sqlite" --out web/data/scan-index.json
      - name: Stamp cache name
        run: sed -i 's/scrinium-dev/scrinium-${{ github.run_number }}/' web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
