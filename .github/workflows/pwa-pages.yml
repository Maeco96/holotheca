name: PWA pages

# Publishes web/ with GitHub Pages. One-time setup in the repository:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "etl/**"
      - "db/**"
      - ".github/workflows/pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The card index is built from the open TCGdex data at deploy time, so it is never
      # committed and every deployment carries a fresh catalogue.
      - name: Build the card index
        run: |
          git clone --depth 1 https://github.com/tcgdex/cards-database.git "$RUNNER_TEMP/tcgdex"
          python3 etl/build_catalogue.py "$RUNNER_TEMP/tcgdex" --out "$RUNNER_TEMP/catalogue.sqlite"
          python3 etl/export_scan_index.py "$RUNNER_TEMP/catalogue.sqlite" --out web/data/scan-index.json
      # Prices: today's Cardmarket price guide (published file, no account) and the history that
      # prices.yml keeps as release assets. Without them the app simply shows no prices.
      - name: Prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prices" "$RUNNER_TEMP/prices-history"
          gh release download prices-history -p 'history-*.json.gz' -D "$RUNNER_TEMP/prices-history" || echo "no price history yet"
          if python3 etl/prices/cardmarket_prices.py fetch --out "$RUNNER_TEMP/prices"; then
            python3 etl/prices/cardmarket_prices.py phone --guide "$RUNNER_TEMP/prices/price_guide_6.json" \
              --sealed "$RUNNER_TEMP/prices/products_nonsingles_6.json" --singles "$RUNNER_TEMP/prices/products_singles_6.json" \
              --index web/data/scan-index.json \
              --history-dir "$RUNNER_TEMP/prices-history" --out web/data
          else
            echo "::warning::Cardmarket price guide not reachable: this deployment has no prices"
          fi
          # CardTrader offers by language and condition (collected by prices.yml when the token is set).
          gh release download prices-history -p 'cardtrader-latest.json.gz' -D "$RUNNER_TEMP/ct" || echo "no CardTrader offers yet"
          if [ -f "$RUNNER_TEMP/ct/cardtrader-latest.json.gz" ]; then
            python3 etl/prices/cardtrader_prices.py phone --collected "$RUNNER_TEMP/ct/cardtrader-latest.json.gz" \
              --index web/data/scan-index.json --out web/data/cardtrader.json
          fi
      # Addresses of the images on the official card sites (Japan, Korea, Taiwan), from the
      # facts collected by official-sources.yml. Only addresses: the phone loads the images there.
      - name: Map official images
        run: |
          shopt -s nullglob
          files=(etl/sources/data/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            python3 etl/sources/compare.py "$RUNNER_TEMP/catalogue.sqlite" "${files[@]}" \
              --report "$RUNNER_TEMP/official-vs-tcgdex.md" --images web/data/official-images.json
          fi
      - name: Stamp cache name
        run: sed -i 's/holotheca-dev/holotheca-${{ github.run_number }}/' web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
