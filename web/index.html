<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scrinium">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181c2c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Scrinium</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: #181c2c; color: #f0f0f0;
      font: 16px/1.4 -apple-system, system-ui, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px;
    }
    h1 { margin: 0; font-size: 18px; }
    .stage { position: relative; flex: 1; min-height: 240px; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .frame { position: absolute; inset: 8% 18%; border: 2px dashed rgba(255,255,255,.7); border-radius: 10px; pointer-events: none; }
    button { font: inherit; padding: 12px 16px; border: 0; border-radius: 10px; background: #5a8cff; color: #fff; }
    button[disabled] { opacity: .5; }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
    dt { color: #9aa3bd; } dd { margin: 0; }
    .note { font-size: 13px; color: #9aa3bd; }
    .err { color: #ff8d8d; }
  </style>
</head>
<body>
  <h1>Scrinium <span id="version"></span></h1>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div>
  </div>
  <button id="start">Start camera</button>
  <dl>
    <dt>Installed as app</dt><dd id="standalone">?</dd>
    <dt>Offline ready</dt><dd id="offline">checking…</dd>
    <dt>Camera</dt><dd id="camera">not started</dd>
    <dt>Stored data</dt><dd id="storage">checking…</dd>
  </dl>
  <p class="note">Phase 0 test page: camera, install and offline check only. Nothing is saved.</p>
  <p id="error" class="err" hidden></p>
  <script src="app.js"></script>
</body>
</html>
